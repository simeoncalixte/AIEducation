[project]
name = "evolvingclass-web"
version = "0.1.0"
description = "EvolvingClass teacher web UI (server-rendered)"
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "sqlalchemy>=2.0", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evolvingclass_web*"]

{% extends "base.html" %}
{% block title %}Edit {{ d.title }} v{{ d.version_no }}{% endblock %}
{% block content %}
<p class="muted"><a href="{{ url_for('version_detail', kind=d.kind, version_id=d.id) }}">Back to proposal</a></p>
<h1>Edit draft: {{ d.title }} · v{{ d.version_no }}</h1>
<form method="post" class="block">
  <label for="rationale">Rationale</label>
  <textarea id="rationale" name="rationale" rows="4">{{ d.rationale }}</textarea>
  {% if d.kind == "asset" %}
  <label for="content_ref">Content ref</label>
  <input type="text" id="content_ref" name="content_ref" value="{{ d.content_ref }}">
  {% endif %}
  <p><button type="submit">Save draft</button></p>
</form>
{% endblock %}

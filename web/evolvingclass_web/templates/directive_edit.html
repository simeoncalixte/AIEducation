{% extends "base.html" %}
{% block title %}Edit directive #{{ d.id }}{% endblock %}
{% block content %}
<p class="muted"><a href="{{ url_for('directives', lesson_id=d.lesson_id) }}">Directives</a> /
edit #{{ d.id }}</p>
<h1>Edit directive #{{ d.id }}</h1>
<p class="muted">{{ d.kind }} · {{ d.scope }} ·
{{ "active" if d.active else "inactive" }}</p>
<form method="post" class="block">
  <label for="focus">Focus</label>
  <input type="text" id="focus" name="focus" required
         value="{{ form.get('focus', d.focus) if form else d.focus }}">
  <label for="must_include">Must-include (comma-separated)</label>
  <input type="text" id="must_include" name="must_include"
         value="{{ form.get('must_include', d.must_include) if form else d.must_include }}">
  <label for="must_avoid">Must-avoid (comma-separated)</label>
  <input type="text" id="must_avoid" name="must_avoid"
         value="{{ form.get('must_avoid', d.must_avoid) if form else d.must_avoid }}">
  <label for="priority">Priority</label>
  <input type="text" id="priority" name="priority" size="4"
         value="{{ form.get('priority', d.priority) if form else d.priority }}">
  <div><button type="submit">Save directive</button></div>
</form>
{% endblock %}
